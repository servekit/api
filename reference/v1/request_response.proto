// Reference request/response messages. Every List/Resolve request carries
// an optional BCP 47 locale; empty defaults to zh-Hans, unresolvable locales
// fall back to en, and the locale never fails the call.
syntax = "proto3";

package reference.v1;

import "buf/validate/validate.proto";
import "reference/v1/enums.proto";
import "reference/v1/message.proto";

message ListCountriesRequest {
  string locale = 1 [
    (buf.validate.field).string.pattern =
      "^$|^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
  ];
}

message ListCountriesResponse {
  repeated Country countries = 1; // name-sorted in the request locale
  string data_version = 2;        // generation stamp, e.g. "2026-09-06"
}

message ListTimezonesRequest {
  string locale = 1 [
    (buf.validate.field).string.pattern =
      "^$|^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
  ];
}

message ListTimezonesResponse {
  repeated Timezone timezones = 1;
  string data_version = 2;
}

message ListLanguagesRequest {
  string locale = 1 [
    (buf.validate.field).string.pattern =
      "^$|^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
  ];
}

message ListLanguagesResponse {
  repeated Language languages = 1;
  string data_version = 2;
}

message ListCurrenciesRequest {
  string locale = 1 [
    (buf.validate.field).string.pattern =
      "^$|^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
  ];
}

message ListCurrenciesResponse {
  repeated Currency currencies = 1;
  string data_version = 2;
}

message ListRegionGroupsRequest {
  string locale = 1 [
    (buf.validate.field).string.pattern =
      "^$|^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
  ];
}

message ListRegionGroupsResponse {
  repeated RegionGroup region_groups = 1; // top level first, then depth
  string data_version = 2;
}

// ParsePhone applies libphonenumber rules to raw input. Bad input never
// fails the RPC: is_valid=false + error_reason carries the reason, and
// guessable fields (country_code/dial_code) are still filled when the
// country is inferable.
message ParsePhoneRequest {
  string raw = 1 [
    (buf.validate.field).string = {min_len: 1, max_len: 32}
  ];
  // alpha-2; disambiguates local-format input; empty = international format only
  string default_region = 2 [
    (buf.validate.field).string.pattern = "^$|^[A-Z]{2}$"
  ];
}

message ParsePhoneResponse {
  bool is_valid = 1;
  string e164 = 2;                  // canonical E.164 when parseable
  string country_code = 3;          // inferred alpha-2, "" when unknown
  string dial_code = 4;             // e.g. "+86", "" when unknown
  string national_number = 5;
  string formatted_international = 6; // E.123 international display form
  PhoneType type = 7;
  string error_reason = 8;          // set when is_valid=false
}

// ResolveCodes is the batch by-code lookup across domains — one call serves
// a registration form's validate-and-fetch. Timezone ids accept backward
// aliases (normalized to canonical). Unresolved inputs land in missing_*;
// the call itself never errors on unknown codes.
message ResolveCodesRequest {
  string locale = 1 [
    (buf.validate.field).string.pattern =
      "^$|^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
  ];
  repeated string country_codes = 2 [
    (buf.validate.field).repeated = {unique: true, max_items: 100}
  ];
  repeated string timezone_ids = 3 [
    (buf.validate.field).repeated = {unique: true, max_items: 100}
  ];
  repeated string language_tags = 4 [
    (buf.validate.field).repeated = {unique: true, max_items: 100}
  ];
  repeated string currency_codes = 5 [
    (buf.validate.field).repeated = {unique: true, max_items: 100}
  ];
}

message ResolveCodesResponse {
  repeated Country countries = 1;
  repeated Timezone timezones = 2;
  repeated Language languages = 3;
  repeated Currency currencies = 4;
  repeated string missing_countries = 5;
  repeated string missing_timezones = 6;
  repeated string missing_languages = 7;
  repeated string missing_currencies = 8;
  string data_version = 9;
}

// GetCountryProfile aggregates everything the domains know about one
// country: base info, its continent/sub-region chain, official languages,
// currently-valid currencies, and IANA zones — a pure join over the
// compiled tables.
message GetCountryProfileRequest {
  string country_code = 1 [(buf.validate.field).string.pattern = "^[A-Z]{2}$"];
  string locale = 2 [
    (buf.validate.field).string.pattern = "^$|^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
  ];
}

message GetCountryProfileResponse {
  Country country = 1;
  // The country's group chain, continent first then sub-regions
  // (e.g. Asia -> Eastern Asia). Empty for territories outside the
  // served hierarchy (e.g. Antarctica sits under the unserved world root).
  repeated RegionGroup region_groups = 2;
  // Official (incl. de facto official) languages, most-spoken first
  // (CLDR territoryInfo); e.g. zh-Hans for CN.
  repeated Language languages = 6;
  repeated Currency currencies = 3; // currently valid in this country
  repeated Timezone timezones = 4;  // IANA zones covering this country
  string data_version = 5;

// ListCountriesByRegion returns every country under a UN M49 group,
// recursively (a continent yields all its sub-regions' countries; a
// sub-region yields its direct members). Ordered by the request locale's
// country collation.
message ListCountriesByRegionRequest {
  string region_code = 1 [(buf.validate.field).string.pattern = "^[0-9]{3}$"];
  string locale = 2 [
    (buf.validate.field).string.pattern = "^$|^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
  ];
}

message ListCountriesByRegionResponse {
  repeated Country countries = 1;
  string data_version = 2;
}

// GetCountryDefaults returns the auto-fill set for "user picked a country":
// primary timezone, default currency (first valid), default language (most
// spoken official), dial code, and the example phone number. Names are
// resolved in the request locale so a form can display without a second
// call.
message GetCountryDefaultsRequest {
  string country_code = 1 [(buf.validate.field).string.pattern = "^[A-Z]{2}$"];
  string locale = 2 [
    (buf.validate.field).string.pattern = "^$|^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
  ];
}

message GetCountryDefaultsResponse {
  string timezone_id = 1;    // primary IANA zone, e.g. "Asia/Shanghai"
  string timezone_name = 2;  // display name in the request locale
  string currency_code = 3;  // first currently-valid currency, e.g. "CNY"
  string currency_name = 4;
  string currency_symbol = 5;
  string language_tag = 6;   // most-spoken official language, e.g. "zh-Hans"
  string language_name = 7;
  string dial_code = 8;      // "+86"
  string example_number = 9; // "+86 138 0013 8000"
  string data_version = 10;
}

// GetDataInfo reports the compiled snapshot: version, locale set, and
// per-domain counts — enough for cache freshness checks and debugging.
message GetDataInfoRequest {}

message GetDataInfoResponse {
  string data_version = 1;
  repeated string locales = 2;
  int32 country_count = 3;
  int32 timezone_count = 4;
  int32 language_count = 5;
  int32 currency_count = 6;
  int32 region_group_count = 7;
}
}
