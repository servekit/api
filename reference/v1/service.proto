// Reference service definitions — RPC declarations only.
syntax = "proto3";

package reference.v1;

import "common/v1/pong.proto";
import "google/protobuf/empty.proto";
import "reference/v1/request_response.proto";

// ReferenceService is the single authoritative source of global static
// reference data: countries + dial codes, timezones, languages, currencies,
// region groups — plus deterministic computation over the same metadata
// family (phone parsing). All data is compiled in; no DB, no runtime
// management. Locale-aware: every List/Resolve honors the request locale.
service ReferenceService {
  rpc Ping(google.protobuf.Empty) returns (common.v1.Pong);

  rpc ListCountries(ListCountriesRequest) returns (ListCountriesResponse);
  rpc ListTimezones(ListTimezonesRequest) returns (ListTimezonesResponse);
  rpc ListLanguages(ListLanguagesRequest) returns (ListLanguagesResponse);
  rpc ListCurrencies(ListCurrenciesRequest) returns (ListCurrenciesResponse);
  rpc ListRegionGroups(ListRegionGroupsRequest)
      returns (ListRegionGroupsResponse);
  rpc ParsePhone(ParsePhoneRequest) returns (ParsePhoneResponse);
  rpc ResolveCodes(ResolveCodesRequest) returns (ResolveCodesResponse);
}
