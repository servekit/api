// Messaging RPC request/response payloads.
syntax = "proto3";

package messaging.v1;

import "buf/validate/validate.proto";
import "messaging/v1/enums.proto";
import "messaging/v1/message.proto";

// SendEmailRequest is the request to send an email.
//
// Policy-driven: the caller supplies only the scene and template params.
// The service resolves (app, EMAIL, scene) → policy → template + ordered
// provider routes, renders subject/body from the template, and sends along
// the route chain with fallback. Callers authenticate via app credentials
// in gRPC metadata (x-app-key / x-app-secret).
message SendEmailRequest {
  repeated EmailAddress to = 1 [(buf.validate.field).repeated.min_items = 1];
  repeated EmailAddress cc = 2;
  repeated EmailAddress bcc = 3;
  EmailAddress reply_to = 4;
  // Scene is the business purpose of this email (required). It selects the
  // send policy configured on the admin surface.
  EmailScene scene = 5;
  // TemplateParams substitute {{param}} placeholders in the template bound
  // by the policy. Required params (declared on the template) must be present.
  map<string, string> template_params = 6;

  // IdempotencyKey is optional. When set, a second request with the same
  // (app_key, idempotency_key) returns the existing record without
  // re-sending. Use a UUID per logical send intent. Max length 64.
  string idempotency_key = 7 [(buf.validate.field).string.max_len = 64];

  // attachments is optional. content attachments are embedded as real MIME
  // parts; url-only attachments are pure references (caller-managed download
  // links) whose metadata is persisted for record queries. Mixed lists are
  // allowed.
  repeated EmailAttachment attachments = 8;

  // Free-form content (dual-mode send): when subject is non-empty, the
  // email content comes from these fields instead of the policy template
  // — the console compose page uses this. {{param}} placeholders inside
  // the free-form content are STILL rendered with template_params. When
  // subject is empty, template mode applies: the policy template is
  // rendered and its required params are enforced. Routing (route chain,
  // quota, idempotency) is identical in both modes.
  string subject = 9;
  string body = 10;
  string html_body = 11;

  option (buf.validate.message).cel = {
    id: "scene_required"
    message: "scene is required"
    expression: "this.scene != 0"
  };
  option (buf.validate.message).cel = {
    id: "content_pair"
    message: "free-form mode requires body when subject is set"
    expression: "this.subject == '' || this.body != ''"
  };
}

// SendSMSRequest is the request to send an SMS.
//
// Policy-driven: the caller supplies only the scene and template params.
// The service resolves (app, SMS, scene) → policy → template + CN/intl
// route chains, picks the chain by the destination country parsed from
// the E.164 number, and sends with ordered fallback.
message SendSMSRequest {
  // to is the destination in E.164 international format ("+8613800138000")
  // — the single canonical phone format. The destination country (which
  // decides the CN vs international route chain) is parsed from it.
  string to = 1 [(buf.validate.field).string.pattern = "^\\+[1-9][0-9]{8,14}$"];
  // Scene is the business purpose of this SMS (required).
  SmsScene scene = 2;
  // TemplateParams substitute {{param}} placeholders (intl content
  // templates) or supply vendor template parameters (CN domestic
  // templates). Required params (declared on the template) must be present.
  map<string, string> template_params = 3;
  // IdempotencyKey is optional. See SendEmailRequest.idempotency_key.
  string idempotency_key = 4 [(buf.validate.field).string.max_len = 64];

  // Free-form content (international destinations only): when non-empty,
  // the SMS body comes from this field ({{param}} placeholders still render
  // with template_params) and raw-content vendors in the intl route chain
  // send it verbatim. Template-based vendors in the chain keep using their
  // per-vendor template codes. Rejected for CN destinations (regulatory:
  // domestic SMS must use vendor pre-registered templates). With no
  // raw-content vendor integrated the chain falls through and fails loudly.
  string content = 5;

  option (buf.validate.message).cel = {
    id: "scene_required"
    message: "scene is required"
    expression: "this.scene != 0"
  };
}

// SendResponse is the response from SendEmail and SendSMS.
message SendResponse {
  int64 id = 1;
  MessageStatus status = 2;
  // vendor reports which vendor actually handled the send.
  oneof vendor {
    EmailVendor email_vendor = 3;
    SmsVendor sms_vendor = 4;
  }
}

// GetEmailRequest is the request to fetch a single email record.
message GetEmailRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

// GetSMSRequest is the request to fetch a single SMS record.
message GetSMSRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

// ListEmailsRequest filters and paginates a ListEmails query.
message ListEmailsRequest {
  EmailVendor vendor = 1;
  EmailScene scene = 2;
  MessageStatus status = 3;
  string target = 4;
  // AppKey identifies the calling app (the authenticated sender identity).
  // Optional filter.
  string app_key = 5;
  int64 start_time = 6;
  int64 end_time = 7;
  int32 page = 8;
  int32 page_size = 9;
  SortField sort_field = 10;
  SortDirection sort_direction = 11;
}

// ListEmailsResponse contains a page of email records plus pagination metadata.
message ListEmailsResponse {
  repeated EmailRecord records = 1;
  int32 total = 2;
  int32 total_pages = 3;
  bool has_more = 4;
}

// ListSMSRequest filters and paginates a ListSMS query.
message ListSMSRequest {
  SmsVendor vendor = 1;
  SmsScene scene = 2;
  MessageStatus status = 3;
  string region_code = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[A-Z]{2}$"
  ];
  string phone = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      pattern: "^\\+[1-9][0-9]{8,14}$"
      max_len: 20
    }
  ];
  // AppKey identifies the calling app (the authenticated sender identity).
  // Optional filter.
  string app_key = 6;
  int64 start_time = 7;
  int64 end_time = 8;
  int32 page = 9;
  int32 page_size = 10;
  SortField sort_field = 11;
  SortDirection sort_direction = 12;
}

// ListSMSResponse contains a page of SMS records plus pagination metadata.
message ListSMSResponse {
  repeated SMSRecord records = 1;
  int32 total = 2;
  int32 total_pages = 3;
  bool has_more = 4;
}

// ListEmailsByCursorRequest filters and cursor-paginates a ListEmailsByCursor
// query. page_token is opaque — obtain it from the previous response's
// next_page_token; empty means first page.
message ListEmailsByCursorRequest {
  EmailVendor vendor = 1;
  EmailScene scene = 2;
  MessageStatus status = 3;
  string target = 4;
  // AppKey identifies the calling app (the authenticated sender identity).
  // Optional filter.
  string app_key = 5;
  int64 start_time = 6;
  int64 end_time = 7;
  SortField sort_field = 8;
  SortDirection sort_direction = 9;
  int32 page_size = 10;
  string page_token = 11;
  // include_total controls whether COUNT(*) runs. Defaults to false: cursor
  // users usually don't need the total, and COUNT(*) is expensive on large
  // tables.
  bool include_total = 12;
}

message ListEmailsByCursorResponse {
  repeated EmailRecord records = 1;
  // total is 0 when include_total = false. Otherwise reflects the count
  // matching the filter (ignoring cursor position).
  int32 total = 2;
  // next_page_token is empty when there is no next page.
  string next_page_token = 3;
}

// ListSMSByCursorRequest filters and cursor-paginates a ListSMSByCursor query.
message ListSMSByCursorRequest {
  SmsVendor vendor = 1;
  SmsScene scene = 2;
  MessageStatus status = 3;
  string region_code = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[A-Z]{2}$"
  ];
  string phone = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      pattern: "^\\+[1-9][0-9]{8,14}$"
      max_len: 20
    }
  ];
  // AppKey identifies the calling app (the authenticated sender identity).
  // Optional filter.
  string app_key = 6;
  int64 start_time = 7;
  int64 end_time = 8;
  SortField sort_field = 9;
  SortDirection sort_direction = 10;
  int32 page_size = 11;
  string page_token = 12;
  bool include_total = 13;
}

message ListSMSByCursorResponse {
  repeated SMSRecord records = 1;
  int32 total = 2;
  string next_page_token = 3;
}

// GetEmailStatsRequest filters a GetEmailStats query.
message GetEmailStatsRequest {
  EmailVendor vendor = 1;
  EmailScene scene = 2;
  int64 start_time = 3;
  int64 end_time = 4;
}

// GetSMSStatsRequest filters a GetSMSStats query.
message GetSMSStatsRequest {
  SmsVendor vendor = 1;
  SmsScene scene = 2;
  int64 start_time = 3;
  int64 end_time = 4;
}

// EmailStatsResponse contains aggregated email statistics.
message EmailStatsResponse {
  int64 total = 1;
  int64 sent = 2;
  int64 failed = 3;
  // success_rate is in [0, 100]; -1 means "no data" (total == 0).
  double success_rate = 4;
  repeated EmailVendorStats vendors = 5;
}

// SMSStatsResponse contains aggregated SMS statistics.
message SMSStatsResponse {
  int64 total = 1;
  int64 sent = 2;
  int64 failed = 3;
  // success_rate is in [0, 100]; -1 means "no data" (total == 0).
  double success_rate = 4;
  repeated SmsVendorStats vendors = 5;
}

// ListSMSRegionsRequest is empty — region sets are low-cardinality and the
// distinct query is cheap, so callers filter client-side if they need to.
message ListSMSRegionsRequest {}

message ListSMSRegionsResponse {
  repeated string region_codes = 1 [(buf.validate.field).repeated.items.string.pattern = "^[A-Z]{2}$"];
}
