// User domain messages (entities / value objects).
syntax = "proto3";

package user.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "user/v1/enums.proto";

// ==================== User ====================

message User {
  int64 id = 1;
  string username = 2;
  string nickname = 3;
  string real_name = 4;
  string avatar_url = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      uri: true
      max_len: 512
    }
  ];
  string email = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      email: true
      max_len: 256
    }
  ];
  // The user's country/region (ISO 3166-1 alpha-2) — a profile attribute of
  // the person (residence), independent of the phone's home country.
  string region_code = 22 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[A-Z]{2}$"
  ];
  // E.164 international format ("+8613800138000") — the single canonical
  // phone format; parts (dial code, national number) are derived from it.
  string phone = 7 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      pattern: "^\\+[1-9][0-9]{8,14}$"
      max_len: 20
    }
  ];
  Gender gender = 8 [(buf.validate.field).enum.defined_only = true];
  string birthday = 9 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      max_len: 10
    }
  ]; // YYYY-MM-DD
  string timezone = 10 [(buf.validate.field).string.max_len = 64];
  string locale = 11 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
      max_len: 16
    }
  ];
  string bio = 12;
  UserStatus status = 13 [(buf.validate.field).enum.defined_only = true];
  IdentityProvider register_source = 14;
  UserType user_type = 19 [(buf.validate.field).enum.defined_only = true];
  google.protobuf.Timestamp last_login_at = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
  // Registration environment (admin-only, enriched by GetUser from the
  // user_register_profiles table; zero on every other read path).
  string register_ip = 23 [(buf.validate.field).string.max_len = 45];
  string register_agent = 24 [(buf.validate.field).string.max_len = 512];
  // Derived from register_agent at read time (never stored).
  DeviceType register_device = 25;
  // The phone's E.164 dial code ("+86"), stored alongside the E.164 phone
  // (written together by the same normalization) so admin stats can filter
  // / group by the phone's home country. Always consistent with phone —
  // unlike the user's region_code, which describes the person.
  string dial_code = 26 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^\\+[1-9][0-9]{0,3}$"
  ];
  // Preferred display currency, ISO 4217 alpha-3 ("" = unset). Reserved
  // for future billing; format-validated only — no reference-service
  // existence check at write time.
  string default_currency = 27 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[A-Z]{3}$"
  ];
  // Reserved for MFA: no write path exists until MFA ships — reads only.
  bool mfa_enabled = 28;
  // The tenant this user belongs to (see UserAppInfo): the app_key of the
  // application the user registered under. Set by the service from the
  // calling app's verified credentials; empty on rows created before
  // tenancy (platform default tenant).
  string app_key = 29;
}

// ==================== Identity ====================

message Identity {
  int64 id = 1;
  IdentityProvider provider = 2 [(buf.validate.field).enum.defined_only = true];
  string provider_uid = 3;
  // verified is true when the identity was bound via a flow that
  // cryptographically confirms control of the target (matching captcha code
  // for EMAIL/PHONE, successful ExchangeCode for OAuth, admin attestation for
  // ADMIN). user-service sets this to true at every write site; there is
  // currently no separate "click the verification link" flow that flips it
  // later — see UserIdentity.Verified godoc in internal/store/models for the
  // full contract.
  bool verified = 4;
  google.protobuf.Timestamp created_at = 5;
}

// ==================== Session ====================

message Session {
  string id = 1;
  string ip = 2;
  DeviceType device_type = 3;
  string os = 4;
  string browser = 5;
  string country = 6;
  string city = 7;
  google.protobuf.Timestamp created_at = 8;
  // Derived from the Redis expiry score; unset on historical rows (the
  // column was removed — activity beyond the live window is unknowable).
  google.protobuf.Timestamp last_active_at = 9;
  bool current = 10;
  // ACTIVE rows come first (from Redis); REVOKED/EXPIRED rows follow as
  // history from the PG tombstone table.
  SessionStatus status = 11;
  // How this session authenticated: the LOGIN_METHOD_* strategy for
  // credential logins; social/mini-program logins have no LoginMethod and
  // stay UNSPECIFIED with login_provider carrying the IdP. Sensitive
  // operations can demand a stronger re-auth based on these.
  LoginMethod login_method = 12;
  // The credential subject (username/email/phone/oauth uid).
  string login_target = 13;
  // Hardware identity when known: iPhone/iPad/Android model (or the
  // Sec-CH-UA-Model hint); empty when unknowable (desktop web).
  string device = 14;
  // The identity provider for social/mini-program logins (EMAIL/PHONE for
  // direct registrations); UNSPECIFIED for plain credential logins.
  IdentityProvider login_provider = 15;
}

message LoginLog {
  int64 id = 1;
  int64 user_id = 2;
  IdentityProvider provider = 3;
  LoginAction action = 4;
  bool success = 5;
  LoginFailReason fail_reason = 6;
  string ip = 7;
  DeviceType device_type = 8;
  string os = 9;
  string browser = 10;
  string country = 11;
  string city = 12;
  google.protobuf.Timestamp created_at = 13;
  // The login method used (账号密码/邮箱密码/手机密码/邮箱验证码/手机验证码).
  // Register rows carry the code method that verified ownership; social
  // logins have no LoginMethod and stay UNSPECIFIED.
  LoginMethod method = 14;
  // Denormalized at read time for list views (rows may outlive usernames);
  // empty when user_id no longer resolves.
  string username = 15;
  // The credential subject of the attempt (username / email / phone /
  // oauth uid), e.g. 17000000000 — the kind derives from method + provider.
  string target = 16;
  // Tenant the attempt happened in (user_apps.app_key); "" on rows from
  // before tenancy.
  string app_key = 17;
}

// ==================== RBAC: Groups ====================

message Group {
  int64 id = 1;
  string name = 2;
  string description = 3;
  int64 parent_id = 4;
  string status = 5;
  int32 member_count = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message GroupMember {
  int64 user_id = 1;
  string nickname = 2;
  string avatar_url = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      uri: true
      max_len: 512
    }
  ];
  string role = 4;
  google.protobuf.Timestamp created_at = 5;
}

// ==================== RBAC: Roles ====================

message Role {
  int64 id = 1;
  string name = 2;
  string description = 3;
  bool is_builtin = 5;
  repeated Permission permissions = 6;
  repeated PermissionGroup perm_groups = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// ==================== RBAC: Permissions ====================

message Permission {
  int64 id = 1;
  string resource = 2;
  string action = 3;
  string description = 4;
  bool is_builtin = 5;
}

message PermissionGroup {
  int64 id = 1;
  string name = 2;
  string description = 3;
  repeated Permission permissions = 4;
  bool is_builtin = 5;
}

message UserRole {
  int64 id = 1;
  int64 role_id = 2;
  string role_name = 3;
  string source = 4; // "direct" / "group:{group_name}"
  google.protobuf.Timestamp created_at = 5;
}

// UserAppInfo is one tenant of the user platform (a calling application's
// user directory). Tenants follow the platform-wide ak/sk pattern: app_key
// is minted server-side ("usr_" + 8 base36), app_secret is the data-plane
// credential presented as x-app-key / x-app-secret metadata by trusted BFFs
// on login/register/admin surfaces — the tenant IS the verified caller.
message UserAppInfo {
  int64 id = 1;
  // app_key identifies the tenant on every tenant-scoped surface; unique,
  // immutable after creation.
  string app_key = 2;
  // app_secret is the tenant credential. Echoed on every read —
  // internal-trust posture, same convention as the other platform apps.
  string app_secret = 3;
  string name = 4;
  // disabled tenants fail every tenant-scoped surface immediately.
  bool disabled = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // is_platform marks the platform-operator tenant: its admin surfaces see
  // across ALL tenants (with an optional app_key filter) instead of being
  // pinned to its own directory.
  bool is_platform = 8;
}
