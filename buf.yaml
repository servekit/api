version: v2
modules:
  - path: .
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/googleapis/googleapis # google/api/annotations.proto — testkit's google.api.http annotations
lint:
  use:
    - STANDARD
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
