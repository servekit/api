// Storage service definitions — RPC declarations only.
syntax = "proto3";

package storage.v1;

import "common/v1/pong.proto";
import "google/protobuf/empty.proto";
import "storage/v1/message.proto";
import "storage/v1/request_response.proto";

// StorageService provides file storage, upload, download, and management capabilities.
service StorageService {
  rpc Ping(google.protobuf.Empty) returns (common.v1.Pong);

  // Upload

  // GenerateUploadURL returns a pre-signed upload URL or instant upload result.
  rpc GenerateUploadURL(GenerateUploadURLRequest) returns (GenerateUploadURLResponse);
  // GetSTSCredential returns STS temporary credentials for client-side upload.
  rpc GetSTSCredential(GetSTSCredentialRequest) returns (GetSTSCredentialResponse);
  // BatchGetSTSCredential returns linkd STS credentials plus per-file upload
  // tokens / instant results for a batch of files. The linkd STS credential
  // is fetched once and reused across all files in the batch.
  rpc BatchGetSTSCredential(BatchGetSTSCredentialRequest) returns (BatchGetSTSCredentialResponse);
  // ConfirmUpload confirms a file upload and creates the file record.
  rpc ConfirmUpload(ConfirmUploadRequest) returns (ConfirmUploadResponse);
  // CancelUpload cancels a pending upload session. Best-effort: only succeeds
  // when the session is still PENDING. The OSS object is NOT deleted (the
  // client may still be uploading); GC reclaims orphaned objects later.
  rpc CancelUpload(CancelUploadRequest) returns (google.protobuf.Empty);

  // Download

  // GenerateDownloadURL returns a pre-signed download URL.
  rpc GenerateDownloadURL(GenerateDownloadURLRequest) returns (GenerateDownloadURLResponse);

  // Links (long-lived references for embedding into external systems)

  // CreateFileLink mints (or returns the existing) anonymous link token for
  // a file. The token is the credential for GetFileLinkDownload — random,
  // not derived from file_id, so renewing retention never invalidates links
  // already embedded in emails or documents. Optionally resets the retention
  // window (renewal).
  rpc CreateFileLink(CreateFileLinkRequest) returns (CreateFileLinkResponse);
  // GetFileLinkDownload is the anonymous link-link backend: recipients hit
  // it from links embedded in emails etc. Returns a freshly presigned
  // short-TTL download URL plus the file summary, or expired=true once the
  // retention window has closed (the link outlives the file only in that
  // sense). No owner required — the token IS the credential.
  rpc GetFileLinkDownload(GetFileLinkDownloadRequest) returns (GetFileLinkDownloadResponse);

  // User File Management

  // ListMyFiles lists files owned by the calling user.
  rpc ListMyFiles(ListMyFilesRequest) returns (ListMyFilesResponse);
  // ListMyFilesPaged lists files owned by the calling user with traditional
  // offset pagination. Use this when the caller needs total_count and page
  // numbers (UI list views with page navigation). For stable iteration under
  // concurrent writes (background scans, exports), use ListMyFiles instead.
  rpc ListMyFilesPaged(ListMyFilesPagedRequest) returns (ListMyFilesPagedResponse);
  // GetMyFile returns details of a file owned by the calling user.
  rpc GetMyFile(GetMyFileRequest) returns (UserFileInfo);
  // UpdateMyFile updates metadata of a user's file.
  rpc UpdateMyFile(UpdateMyFileRequest) returns (UserFileInfo);
  // DeleteMyFile soft-deletes a user's file.
  rpc DeleteMyFile(DeleteMyFileRequest) returns (google.protobuf.Empty);
  // BatchDeleteMyFiles soft-deletes multiple user files.
  rpc BatchDeleteMyFiles(BatchDeleteMyFilesRequest) returns (BatchDeleteMyFilesResponse);

  // Image Processing

  // GenerateProcessURL returns a URL with image processing parameters.
  rpc GenerateProcessURL(GenerateProcessURLRequest) returns (GenerateProcessURLResponse);

  // GenerateCDNURL returns a CDN-fronted signed URL (with expiry) for an
  // already-uploaded file. Caller must own the file. If ops is non-empty,
  // the URL carries image-processing parameters (Aliyun x-oss-process);
  // S3/CloudFront providers reject ops with CDN_IMAGE_PROCESSING_UNSUPPORTED.
  rpc GenerateCDNURL(GenerateCDNURLRequest) returns (GenerateCDNURLResponse);

  // Quota

  // GetMyQuota returns the calling user's storage quota.
  rpc GetMyQuota(GetMyQuotaRequest) returns (QuotaInfo);

  // Admin

  // AdminListFiles lists all files (admin only).
  rpc AdminListFiles(AdminListFilesRequest) returns (AdminListFilesResponse);
  // AdminGetFile returns file details (admin only).
  rpc AdminGetFile(AdminGetFileRequest) returns (AdminFileInfo);
  // AdminDeleteFile deletes a file (admin only).
  rpc AdminDeleteFile(AdminDeleteFileRequest) returns (google.protobuf.Empty);
  // AdminGetQuota returns a user's quota (admin only).
  rpc AdminGetQuota(AdminGetQuotaRequest) returns (QuotaInfo);
  // AdminSetQuota sets a user's quota (admin only).
  rpc AdminSetQuota(AdminSetQuotaRequest) returns (QuotaInfo);
  // AdminGetStats returns storage statistics (admin only).
  rpc AdminGetStats(AdminGetStatsRequest) returns (AdminGetStatsResponse);
  // AdminListProviders lists all storage providers (admin only).
  rpc AdminListProviders(google.protobuf.Empty) returns (AdminListProvidersResponse);
  // AdminListBuckets lists all buckets (admin only).
  rpc AdminListBuckets(google.protobuf.Empty) returns (AdminListBucketsResponse);
  // AdminCreateProvider adds a provider to the live registry (admin only).
  rpc AdminCreateProvider(AdminCreateProviderRequest) returns (AdminCreateProviderResponse);
  // AdminUpdateProvider edits a provider (credentials replace-on-present).
  rpc AdminUpdateProvider(AdminUpdateProviderRequest) returns (AdminUpdateProviderResponse);
  // AdminDeleteProvider removes a provider (rejected while buckets are
  // still bound to it).
  rpc AdminDeleteProvider(AdminDeleteProviderRequest) returns (google.protobuf.Empty);
  // AdminUpsertBucket creates or fully replaces a bucket binding
  // (rejected while the bucket still has objects and the provider changes).
  rpc AdminUpsertBucket(AdminUpsertBucketRequest) returns (AdminUpsertBucketResponse);
  // AdminDeleteBucket removes a bucket binding (rejected while the bucket
  // still has objects).
  rpc AdminDeleteBucket(AdminDeleteBucketRequest) returns (google.protobuf.Empty);
  // AdminGetSettings returns the runtime settings row (default/public
  // bucket).
  rpc AdminGetSettings(AdminGetSettingsRequest) returns (AdminGetSettingsResponse);
  // AdminUpdateSettings updates the runtime settings row.
  rpc AdminUpdateSettings(AdminUpdateSettingsRequest) returns (AdminUpdateSettingsResponse);
  // AdminEnsureTenantConfig idempotently provisions the tenant's config row
  // (one row per tenant; the row keeps its internal app identity — secret
  // echoed on every read). Phase ④ T6 rename of AdminCreateApp.
  rpc AdminEnsureTenantConfig(AdminEnsureTenantConfigRequest) returns (AdminEnsureTenantConfigResponse);
  // AdminGetTenantConfig returns one tenant config by tenant_key.
  rpc AdminGetTenantConfig(AdminGetTenantConfigRequest) returns (AdminGetTenantConfigResponse);
  // AdminUpdateTenantConfig edits name/disabled/bucket; identity and
  // key_prefix are immutable.
  rpc AdminUpdateTenantConfig(AdminUpdateTenantConfigRequest) returns (AdminUpdateTenantConfigResponse);
  // AdminRotateTenantConfigSecret mints a new secret (shown once).
  rpc AdminRotateTenantConfigSecret(AdminRotateTenantConfigSecretRequest) returns (AdminRotateTenantConfigSecretResponse);
  // AdminListTenantConfigs lists the configs in the caller's scope (low
  // cardinality, no paging).
  rpc AdminListTenantConfigs(AdminListTenantConfigsRequest) returns (AdminListTenantConfigsResponse);
  // AdminDeleteTenantConfig soft-deletes a config; its data-plane calls
  // fail immediately.
  rpc AdminDeleteTenantConfig(AdminDeleteTenantConfigRequest) returns (google.protobuf.Empty);
  // AdminSoftDeleteOwnerFiles soft-deletes all files for an owner (admin only).
  rpc AdminSoftDeleteOwnerFiles(AdminSoftDeleteOwnerFilesRequest) returns (AdminSoftDeleteOwnerFilesResponse);
  // AdminDeleteOwner soft-deletes all files and quota for an owner (admin only).
  rpc AdminDeleteOwner(AdminDeleteOwnerRequest) returns (AdminDeleteOwnerResponse);

  // Audit Log

  // ListMyAuditLogs lists audit logs for the calling user.
  rpc ListMyAuditLogs(ListMyAuditLogsRequest) returns (ListMyAuditLogsResponse);
  // AdminListAuditLogs lists all audit logs (admin only).
  rpc AdminListAuditLogs(AdminListAuditLogsRequest) returns (AdminListAuditLogsResponse);

  // Business-facing quota management.
  // Auth posture: storage gRPC is internal-network trusted; API-level
  // permissions are enforced at the gateway (testkit login, future RBAC +
  // rules engine). See specs/2026-09-07-storage-platform-design.md.

  // SetOwnerQuota overwrites an owner's total quota. Business-facing (e.g.
  // pay-service resetting quota after a plan change). For admin tools use
  // AdminSetQuota.
  rpc SetOwnerQuota(SetOwnerQuotaRequest) returns (QuotaInfo);
  // AddOwnerQuota atomically increments an owner's quota by delta_bytes
  // (positive for purchase, negative for refund). Caller is responsible for
  // idempotency (e.g. deduplicate by order ID upstream).
  rpc AddOwnerQuota(AddOwnerQuotaRequest) returns (QuotaInfo);
}
