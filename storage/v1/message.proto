// Storage domain messages (entities / value objects).
syntax = "proto3";

package storage.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "storage/v1/enums.proto";

// Owner identifies the owner of a resource (user, group, business, etc.).
message Owner {
  OwnerType owner_type = 1 [(buf.validate.field).enum = {defined_only: true}];
  int64 owner_id = 2 [(buf.validate.field).int64 = {gt: 0}];
}

message UploadFileMeta {
  string md5 = 1 [(buf.validate.field).string = {len: 32}];
  int64 size = 2 [(buf.validate.field).int64 = {gt: 0}];
  string filename = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string content_type = 4 [(buf.validate.field).string = {min_len: 1}];
  string file_path = 5;
  string description = 6;
  map<string, string> metadata = 7;
}

message UploadCredentialItem {
  oneof result {
    UploadTokenInfo token = 1;
    ItemError error = 2;
  }
}

// UploadTokenInfo carries either an upload_token (client must ConfirmUpload
// after the upload) or a file_id when MD5 dedup hit (instant upload).
message UploadTokenInfo {
  string upload_token = 1;
  int64 expires_at = 2;
  // file_id is set when MD5 dedup hit (instant). upload_token is empty in that case.
  int64 file_id = 3;
  // object_key is the full OSS object path the client must PUT to (e.g.
  // "<keyPrefix>/<md5[:2]>/<md5>"). Empty when file_id is set (instant dedup,
  // no upload needed). Single-file GetSTSCredential callers read object_key
  // from the top-level response; batch callers read it from each item.
  string object_key = 4;
}

message ItemError {
  int32 index = 1;
  string code = 2;
  string message = 3;
}

// Image Processing

message ImageProcessOp {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_RESIZE = 1;
    TYPE_CROP = 2;
    TYPE_QUALITY = 3;
    TYPE_FORMAT = 4;
    TYPE_WATERMARK = 5;
    TYPE_ROTATE = 6;
  }
  Type type = 1;
  int32 width = 2;
  int32 height = 3;
  ImageFormat format = 4;
  int32 quality = 5;
  ImageResizeMode resize_mode = 6;
  string watermark_text = 7;
  int32 rotate_degrees = 8;
}

message QuotaInfo {
  int64 total_bytes = 1;
  int64 used_bytes = 2;
  int64 available_bytes = 3;
  int32 file_count = 4;
}

// File Info

message UserFileInfo {
  int64 id = 1;
  string filename = 2;
  string file_path = 3;
  string description = 4;
  map<string, string> metadata = 5;
  bool is_public = 6;
  OwnerType owner_type = 7;
  int64 size = 10;
  string content_type = 11;
  string extension = 12;
  string md5 = 13;
  string created_at = 20;
  string updated_at = 21;
}

message AdminFileInfo {
  int64 id = 1;
  OwnerType owner_type = 2;
  int64 owner_id = 3;
  string filename = 4;
  string file_path = 5;
  string description = 6;
  map<string, string> metadata = 7;
  bool is_public = 8;
  int64 object_id = 9;
  int64 size = 10;
  string content_type = 11;
  string extension = 12;
  string md5 = 13;
  string provider = 14;
  string bucket = 15;
  string object_key = 16;
  string created_at = 20;
  string updated_at = 21;
}

message OwnerStats {
  OwnerType owner_type = 1;
  int64 file_count = 2;
  int64 total_bytes = 3;
}

message ProviderStats {
  string provider = 1;
  int64 object_count = 2;
  int64 total_bytes = 3;
}

message BucketStats {
  string bucket = 1;
  int64 object_count = 2;
  int64 total_bytes = 3;
  int64 file_count = 4;
}

message ProviderInfo {
  string name = 1;
  Vendor vendor = 2;
  string endpoint = 3;
  string region = 4;
  // disabled providers are skipped for new uploads (existing objects stay
  // readable through their buckets... until the provider is deleted).
  bool disabled = 5;
  // sts_enabled reports whether role_arn is configured (STS credentials
  // available for direct browser uploads).
  bool sts_enabled = 6;
  // bucket_count is the number of buckets bound to this provider.
  int32 bucket_count = 7;
}

message BucketInfo {
  string name = 1;
  string provider = 2;
  reserved 3;
  reserved "key_prefix"; // moved to StorageAppInfo.key_prefix — prefixes belong to apps
  BucketACL acl = 4;
  Vendor vendor = 5;
  // cdn is the bucket's CDN fronting config; null = CDN disabled.
  CDNConfig cdn = 6;
}

// StorageAppInfo is one calling application of the storage platform. Data
// isolation is by key_prefix: every object an app writes lives under its
// prefix (within the app's bucket, or the default bucket when bucket_id=0);
// PUBLIC uploads land in the public bucket but keep the same prefix. The
// prefix is the dedup domain — identical content under different prefixes is
// stored (and deduplicated) independently.
message StorageAppInfo {
  int64 id = 1;
  // app_key identifies the app on every data-plane call (x-app-key metadata);
  // immutable after creation.
  string app_key = 2;
  string name = 3;
  // key_prefix namespaces every object the app writes. Global unique,
  // immutable, must end with '/'. All key composition is plain concatenation.
  string key_prefix = 4;
  // bucket_id selects the app's private bucket; 0 = the platform default
  // bucket. PUBLIC uploads always land in the public bucket regardless.
  // Changing buckets only affects new uploads.
  int64 bucket_id = 5;
  // disabled apps fail every data-plane call immediately.
  bool disabled = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
  // app_secret is the data-plane credential (x-app-secret metadata). Echoed
  // on every read — internal-trust posture, same convention as messaging
  // apps; the ops console is the intended reader.
  string app_secret = 9;
}

// CDNConfig is a bucket's CDN fronting configuration. auth_key signs URLs
// for Aliyun/Tencent-style CDN; key_pair_id is CloudFront-only (AWS S3 /
// S3-compatible vendors).
message CDNConfig {
  string domain = 1 [(buf.validate.field).string.min_len = 1];
  string auth_key = 2;
  string key_pair_id = 3;
}

// StorageSettings is the runtime-editable service-level settings row
// (moved out of YAML config; managed via AdminGet/UpdateSettings).
message StorageSettings {
  // default_bucket receives uploads that do not specify a bucket.
  string default_bucket = 1;
  // public_bucket receives visibility=PUBLIC uploads; empty = PUBLIC
  // uploads are rejected.
  string public_bucket = 2;
}

// Audit Log

message AuditLogEntry {
  int64 id = 1;
  AuditAction action = 2;
  OwnerType owner_type = 3;
  int64 owner_id = 4;
  AuditLogTargetType target_type = 5;
  int64 target_id = 6;
  google.protobuf.Struct before = 7;
  google.protobuf.Struct after = 8;
  AuditLogStatus status = 9;
  string error_message = 10;
  string request_id = 11;
  string created_at = 12;
  // Verified acting user (from the request actor) who performed the
  // operation; 0 when no actor was present (system / internal calls).
  int64 operator_user_id = 13;
}
