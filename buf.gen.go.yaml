# Go codegen: one generated Go package per domain (common/gid/user/...).
# Output is the nested Go module gen/go (github.com/servekit/api/gen/go).
#
# grpc-gateway runs for annotated services only (testkit); annotation-less
# protos produce no gateway output. OpenAPI/Swagger 2.0 derives from the same
# annotations and lands in gen/openapi/ for testkit's web client generation.
version: v2
clean: true
inputs:
  - directory: .
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/servekit/api/gen/go
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
    - file_option: go_package
      module: buf.build/googleapis/googleapis
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/openapiv2
    out: gen/openapi
    opt:
      - simple_operation_ids=true # operationId = "<RpcName>" (concise, no path prefix)
      - logtostderr=true # surface generation warnings to stderr
