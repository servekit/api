// Testkit RPC request/response payloads.
syntax = "proto3";

package testkit.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "license/v1/enums.proto";
import "messaging/v1/enums.proto";
import "storage/v1/enums.proto";
import "telemetry/v1/enums.proto";
import "testkit/v1/message.proto";
import "user/v1/enums.proto";

// LoginRequest is the curated frontend DTO for login. Field names line up 1:1
// with user-service LoginRequest; the auth mapping layer int-casts the enums.
message LoginRequest {
  user.v1.LoginMethod method = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string username = 2 [(buf.validate.field).string.max_len = 256];
  string password = 3 [(buf.validate.field).string.max_len = 128];
  string code = 4 [(buf.validate.field).string.max_len = 16];
  string email = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      email: true
      max_len: 256
    }
  ];
  string dial_code = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^\\+[1-9][0-9]{0,3}$"
  ];
  string phone = 7 [(buf.validate.field).string.max_len = 20];
  // captcha_id returned by SendVerificationCode; required for code-based login.
  string captcha_id = 8 [(buf.validate.field).string.max_len = 128];
}

// RegisterRequest is the curated frontend DTO for registration.
message RegisterRequest {
  user.v1.IdentityProvider provider = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string email = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      email: true
      max_len: 256
    }
  ];
  string code = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 16
  }];
  string username = 4 [(buf.validate.field).string.max_len = 64];
  string nickname = 5 [(buf.validate.field).string.max_len = 64];
  string password = 6 [(buf.validate.field).string.max_len = 128];
  string dial_code = 7 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^\\+[1-9][0-9]{0,3}$"
  ];
  string phone = 8 [(buf.validate.field).string.max_len = 20];
  // captcha_id returned by SendVerificationCode; required to verify the code.
  string captcha_id = 9 [(buf.validate.field).string.max_len = 128];
  // Optional initial profile fields (mirror user-service RegisterRequest).
  user.v1.Gender gender = 10 [(buf.validate.field).enum.defined_only = true];
  string timezone = 11 [(buf.validate.field).string.max_len = 64];
  string locale = 12 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
      max_len: 16
    }
  ];
}

// SendVerificationCodeRequest is the curated frontend DTO for requesting a
// verification code. The vendor template fields (sms_template_id, email_body,
// ...) live in user-service and are intentionally NOT exposed here — the BFF
// supplies them from server config, not the frontend (design spec §3.2.2).
message SendVerificationCodeRequest {
  string email = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      email: true
      max_len: 256
    }
  ];
  user.v1.VerificationChannel channel = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  user.v1.VerificationPurpose purpose = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string dial_code = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^\\+[1-9][0-9]{0,3}$"
  ];
  string phone = 5 [(buf.validate.field).string.max_len = 20];
  // Delivery content (templates, signatures, vendor routing) is owned by
  // message-service policies — mirrors user.v1.SendVerificationCodeRequest.
  reserved 6, 7, 8, 9, 10, 11, 12, 13;
  reserved "sender_id", "sms_template_id", "sms_code_param_key", "sms_content";
  reserved "email_subject", "email_body", "email_html_body", "sign_name";
}

// SendVerificationCodeResponse returns the captcha_id that binds the generated
// code to this flow; it must be passed back to Register/Login.
message SendVerificationCodeResponse {
  string captcha_id = 1;
}

// TokenResponse is returned by every login-class RPC (Login, Register).
// token IS the user-service session id (an opaque session token); session_id
// mirrors it for testers targeting a specific session directly.
message TokenResponse {
  string token = 1;
  User user = 2;
  string session_id = 3;
  // is_new: this login auto-registered the account (code-login/OAuth paths).
  bool is_new = 4;
  // return_to: business URL recorded at GetOAuthURL time (OAuth flows only;
  // empty for password/code logins).
  string return_to = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      uri: true
      max_len: 2048
    }
  ];
}

// ==================== P2 request/response messages ====================
//
// Curation (design spec §3.2): "my" RPCs (GetProfile / UpdateProfile /
// ChangePassword / ListIdentities / BindIdentity / BindOAuthIdentity /
// UnbindIdentity / ListSessions / RevokeAllSessions) drop the caller's user_id
// — the BFF injects it from ctx. Target resource IDs (user_id / identity_id /
// session_id / group_id / role_id / permission_id / permission_group_id) are
// kept: they describe WHAT is acted on, not WHO is calling.

// ---- Profile (P2) ----
message GetProfileRequest {} // user_id injected from ctx

message UpdateProfileRequest {
  string username = 1 [(buf.validate.field).string.max_len = 64];
  string nickname = 2 [(buf.validate.field).string.max_len = 64];
  string real_name = 3 [(buf.validate.field).string.max_len = 64];
  string avatar_url = 4 [(buf.validate.field).string.max_len = 512];
  user.v1.Gender gender = 5 [(buf.validate.field).enum.defined_only = true];
  string birthday = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      max_len: 10
    }
  ];
  string timezone = 7 [(buf.validate.field).string.max_len = 64];
  string locale = 8 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
      max_len: 16
    }
  ];
  string bio = 9 [(buf.validate.field).string.max_len = 512];
  // ISO 4217 alpha-3; "" leaves the stored value untouched.
  string default_currency = 10 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[A-Z]{3}$"
  ];
  // The user's country/region (ISO 3166-1 alpha-2); "" leaves it untouched.
  string region_code = 11 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[A-Z]{2}$"
  ];
}

message ChangePasswordRequest {
  string old_password = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string new_password = 2 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
}

message ResetPasswordRequest {
  string email = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      email: true
      max_len: 256
    }
  ];
  string code = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 16
  }];
  string new_password = 3 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
  string dial_code = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^\\+[1-9][0-9]{0,3}$"
  ];
  string phone = 5 [(buf.validate.field).string.max_len = 20];

  option (buf.validate.message).cel = {
    id: "target_exclusive"
    message: "exactly one of email or dial_code+phone must be set"
    expression: "(this.email != '' && this.dial_code == '' && this.phone == '') || (this.email == '' && this.dial_code != '' && this.phone != '')"
  };
}

// ---- Identity (P2) ----
message ListIdentitiesRequest {} // user_id from ctx

message ListIdentitiesResponse {
  repeated Identity identities = 1;
}

message BindIdentityRequest {
  user.v1.IdentityProvider provider = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string email = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      email: true
      max_len: 256
    }
  ];
  string code = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 16
  }];
  string password = 4 [(buf.validate.field).string.max_len = 128];
  string dial_code = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^\\+[1-9][0-9]{0,3}$"
  ];
  string phone = 6 [(buf.validate.field).string.max_len = 20];

  option (buf.validate.message).cel = {
    id: "target_exclusive"
    message: "exactly one of email or dial_code+phone must be set"
    expression: "(this.email != '' && this.dial_code == '' && this.phone == '') || (this.email == '' && this.dial_code != '' && this.phone != '')"
  };
}

message BindOAuthIdentityRequest {
  user.v1.IdentityProvider provider = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [
      0,
      1,
      2
    ]
  }]; // OAuth only
  string code = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  string state = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message BindOAuthIdentityResponse {
  Identity identity = 1;
}

message UnbindIdentityRequest {
  int64 identity_id = 1 [(buf.validate.field).int64.gt = 0]; // target identity
  // Empty for OAuth identities (session is the proof).
  string code = 2 [(buf.validate.field).string.max_len = 16];
  // user_id injected from ctx
}

// ---- Session (P2) ----
message ListSessionsRequest { // user_id from ctx
  // History pages are cursor-based; the first call (empty cursor) also
  // returns the LIVE sessions ahead of the history (see user.v1).
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  string cursor = 2 [(buf.validate.field).string.max_len = 64];
  // Optional status filter (see user.v1): ACTIVE = live rows only;
  // REVOKED/EXPIRED page the matching tombstones.
  user.v1.SessionStatus status = 3 [(buf.validate.field).enum.defined_only = true];
}

message ListSessionsResponse {
  repeated Session sessions = 1;
  string next_cursor = 2;
}

message RevokeSessionRequest {
  string session_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message RevokeAllSessionsRequest {} // user_id from ctx

message GetSessionRequest {
  string session_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetSessionResponse {
  int64 user_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  google.protobuf.Timestamp created_at = 3;
  string ip = 4;
  string user_agent = 5;
  string os = 6;
  string browser = 7;
  user.v1.LoginMethod login_method = 8 [(buf.validate.field).enum.defined_only = true];
  user.v1.IdentityProvider login_provider = 9 [(buf.validate.field).enum.defined_only = true];
}

message IssueSessionCodeRequest {
  string session_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message IssueSessionCodeResponse {
  string code = 1;
}

message ExchangeSessionCodeRequest {
  string code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message ExchangeSessionCodeResponse {
  string session_id = 1;
  int64 user_id = 2;
}

// ---- Social (P2) ----
// All four are public (no caller user_id). SocialLogin / MiniProgram* return
// the downstream session id as the bearer token.
message GetOAuthURLRequest {
  user.v1.IdentityProvider provider = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string return_to = 2 [(buf.validate.field).string.max_len = 512];
  string state = 3 [(buf.validate.field).string.max_len = 128];
}

message GetOAuthURLResponse {
  string url = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      uri: true
      max_len: 2048
    }
  ];
  string state = 2;
}

message SocialLoginRequest {
  user.v1.IdentityProvider provider = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string code = 2 [(buf.validate.field).string = {min_len: 1}];
  string state = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message MiniProgramLoginRequest {
  string code = 1 [(buf.validate.field).string = {min_len: 1}];
  string nickname = 2 [(buf.validate.field).string.max_len = 64];
  string avatar_url = 3 [(buf.validate.field).string.max_len = 512];
}

message MiniProgramPhoneLoginRequest {
  string login_code = 1 [(buf.validate.field).string = {min_len: 1}];
  string phone_code = 2 [(buf.validate.field).string = {min_len: 1}];
  string nickname = 3 [(buf.validate.field).string.max_len = 64];
  string avatar_url = 4 [(buf.validate.field).string.max_len = 512];
}

// SocialLoginResponse is the shared response for all social-login RPCs.
// token IS the session id; session_id mirrors it for direct targeting
// (RevokeSession / GetSession).
message SocialLoginResponse {
  string token = 1;
  User user = 2;
  bool is_new = 3;
  string return_to = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      uri: true
      max_len: 2048
    }
  ]; // meaningful only for SocialLogin (OAuth callback flow)
  string session_id = 5;
}

// ---- Admin-Users (P2) ----
// target user_id is kept; GetLoginLogs.user_id is an optional filter.
message CreateUserRequest {
  user.v1.UserType user_type = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string username = 2 [(buf.validate.field).string.max_len = 64];
  string nickname = 3 [(buf.validate.field).string.max_len = 64];
  string real_name = 4 [(buf.validate.field).string.max_len = 64];
  string email = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      email: true
      max_len: 256
    }
  ];
  string dial_code = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^\\+[1-9][0-9]{0,3}$"
  ];
  string phone = 7 [(buf.validate.field).string.max_len = 20];
  string password = 8 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
  user.v1.Gender gender = 9 [(buf.validate.field).enum.defined_only = true];
  string timezone = 10 [(buf.validate.field).string.max_len = 64];
  string locale = 11 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
      max_len: 16
    }
  ];
}

message CreateUserResponse {
  User user = 1;
}

message GetUserRequest {
  int64 user_id = 1 [(buf.validate.field).int64.gt = 0]; // target user (kept)
}

message DisableUserRequest {
  int64 user_id = 1 [(buf.validate.field).int64.gt = 0]; // target user (kept)
  bool disable = 2;
  string reason = 3 [(buf.validate.field).string.max_len = 512];
}

message ListUsersRequest {
  user.v1.UserStatus status = 1;
  string nickname = 2 [(buf.validate.field).string.max_len = 64];
  int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  string cursor = 4 [(buf.validate.field).string.max_len = 64];
  user.v1.Gender gender = 5;
  user.v1.IdentityProvider register_source = 6;
  user.v1.DeviceType register_device = 7;
  string locale = 8 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
      max_len: 16
    }
  ];
  string timezone = 9 [(buf.validate.field).string.max_len = 64];
  string register_ip = 10 [(buf.validate.field).string.max_len = 45];
  string last_login_ip = 11 [(buf.validate.field).string.max_len = 45];
  google.protobuf.Timestamp created_at_start = 12;
  google.protobuf.Timestamp created_at_end = 13;
  google.protobuf.Timestamp last_login_at_start = 14;
  google.protobuf.Timestamp last_login_at_end = 15;
  repeated int64 user_ids = 16;
  string email = 17 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      email: true
      max_len: 256
    }
  ];
  string region_code = 18 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[A-Z]{2}$"
  ];
  string phone = 19 [(buf.validate.field).string.max_len = 20];
  string username = 20 [(buf.validate.field).string.max_len = 64];
  user.v1.UserType user_type = 21 [(buf.validate.field).enum.defined_only = true];
  user.v1.UserSortField order_by = 22 [(buf.validate.field).enum.defined_only = true];
  bool descending = 23;
}

message ListUsersResponse {
  repeated User users = 1;
  string next_cursor = 2;
}

message ListUsersPagedRequest {
  user.v1.UserStatus status = 1;
  string nickname = 2 [(buf.validate.field).string.max_len = 64];
  user.v1.Gender gender = 3;
  user.v1.IdentityProvider register_source = 4;
  user.v1.DeviceType register_device = 5;
  user.v1.UserType user_type = 6;
  string locale = 7 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
      max_len: 16
    }
  ];
  string timezone = 8 [(buf.validate.field).string.max_len = 64];
  string register_ip = 9 [(buf.validate.field).string.max_len = 45];
  string last_login_ip = 10 [(buf.validate.field).string.max_len = 45];
  google.protobuf.Timestamp created_at_start = 11;
  google.protobuf.Timestamp created_at_end = 12;
  google.protobuf.Timestamp last_login_at_start = 13;
  google.protobuf.Timestamp last_login_at_end = 14;
  repeated int64 user_ids = 15;
  string email = 16 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      email: true
      max_len: 256
    }
  ];
  string region_code = 17 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[A-Z]{2}$"
  ];
  string phone = 18 [(buf.validate.field).string.max_len = 20];
  string username = 19 [(buf.validate.field).string.max_len = 64];
  user.v1.UserSortField order_by = 20 [(buf.validate.field).enum.defined_only = true];
  bool descending = 21;
  int32 page = 22 [(buf.validate.field).int32.gte = 1];
  int32 page_size = 23 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  bool count = 24;
}

message ListUsersPagedResponse {
  repeated User users = 1;
  int64 total = 2;
  int32 total_pages = 3;
}

message GetLoginLogsRequest {
  int64 user_id = 1; // optional filter (0 = all); kept
  user.v1.IdentityProvider provider = 2;
  // optional: presence distinguishes "filter failed attempts" (false) from
  // "no filter" — a plain proto3 bool cannot tell those apart.
  optional bool success = 3;
  int32 page_size = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  string cursor = 5 [(buf.validate.field).string.max_len = 64];
  user.v1.LoginAction action = 6; // optional filter (0 = all)
  user.v1.LoginMethod method = 7; // optional filter (0 = all)
  // Alternative to user_id: resolve the username server-side. user_id wins
  // when both are set; an unknown username yields an empty page.
  string username = 8 [(buf.validate.field).string.max_len = 64];
}

message GetLoginLogsResponse {
  repeated LoginLog logs = 1;
  string next_cursor = 2;
  int32 total = 3;
}

// ---- RBAC-Group (P2) ----
message CreateGroupRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string description = 2 [(buf.validate.field).string.max_len = 512];
  int64 parent_id = 3;
}

message GetGroupRequest {
  int64 group_id = 1 [(buf.validate.field).int64.gt = 0];
}

message UpdateGroupRequest {
  int64 group_id = 1 [(buf.validate.field).int64.gt = 0];
  string name = 2 [(buf.validate.field).string.max_len = 64];
  string description = 3 [(buf.validate.field).string.max_len = 512];
}

message ListGroupsRequest {
  string status = 1 [(buf.validate.field).string.max_len = 32];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  string cursor = 3 [(buf.validate.field).string.max_len = 64];
}

message ListGroupsResponse {
  repeated Group groups = 1;
  string next_cursor = 2;
  int32 total = 3;
}

message DeleteGroupRequest {
  int64 group_id = 1 [(buf.validate.field).int64.gt = 0];
}

message AddGroupMemberRequest {
  int64 group_id = 1 [(buf.validate.field).int64.gt = 0]; // path
  int64 user_id = 2 [(buf.validate.field).int64.gt = 0]; // target member (kept)
  string role = 3 [(buf.validate.field).string = {
    in: [
      "owner",
      "admin",
      "member"
    ]
  }];
}

message RemoveGroupMemberRequest { // group_id + user_id both from path
  int64 group_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 user_id = 2 [(buf.validate.field).int64.gt = 0];
}

message ListGroupMembersRequest {
  int64 group_id = 1 [(buf.validate.field).int64.gt = 0]; // path
  string role = 2 [(buf.validate.field).string.max_len = 32];
  int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  string cursor = 4 [(buf.validate.field).string.max_len = 64];
}

message ListGroupMembersResponse {
  repeated GroupMember members = 1;
  string next_cursor = 2;
  int32 total = 3;
}

message AddGroupRoleRequest {
  int64 group_id = 1 [(buf.validate.field).int64.gt = 0]; // path
  int64 role_id = 2 [(buf.validate.field).int64.gt = 0];
}

message RemoveGroupRoleRequest { // group_id + role_id from path
  int64 group_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 role_id = 2 [(buf.validate.field).int64.gt = 0];
}

message ListGroupRolesRequest {
  int64 group_id = 1 [(buf.validate.field).int64.gt = 0];
}

message ListGroupRolesResponse {
  repeated Role roles = 1;
}

// ---- RBAC-Role (P2) ----
message CreateRoleRequest {
  string name = 1 [(buf.validate.field).string = {
