// ---- Send (policy-driven — the BFF injects its app credentials when
// calling message-service; the request carries scene + params only) ----

message SendEmailRequest {
  repeated EmailAddress to = 1 [(buf.validate.field).repeated.min_items = 1];
  repeated EmailAddress cc = 2;
  repeated EmailAddress bcc = 3;
  EmailAddress reply_to = 4;
  // Scene selects the message-service send policy (required).
  messaging.v1.EmailScene scene = 5;
  // TemplateParams render {{param}} placeholders — in the policy template
  // (template mode) or in the free-form content below.
  map<string, string> template_params = 6;
  string idempotency_key = 7 [(buf.validate.field).string.max_len = 64];
  repeated EmailAttachment attachments = 8;
  // Free-form content: subject non-empty → content comes from these fields
  // ({{param}} still rendered); subject empty → policy template renders.
  string subject = 9;
  string body = 10;
  string html_body = 11;

  option (buf.validate.message).cel = {
    id: "scene_required"
    message: "scene is required"
    expression: "this.scene != 0"
  };
}

message SendSMSRequest {
  string dial_code = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^\\+[1-9][0-9]{0,3}$"
  ];
  string phone = 2 [(buf.validate.field).string.min_len = 1];
  // Scene selects the message-service send policy (required).
  messaging.v1.SmsScene scene = 3;
  // TemplateParams feed the policy template's {{param}} placeholders.
  map<string, string> template_params = 4;
  string idempotency_key = 5 [(buf.validate.field).string.max_len = 64];

  option (buf.validate.message).cel = {
    id: "scene_required"
    message: "scene is required"
    expression: "this.scene != 0"
  };
  option (buf.validate.message).cel = {
    id: "phone_no_plus"
    message: "phone must not start with '+'"
    expression: "!this.phone.startsWith('+')"
  };
}

// SendResponse splits the downstream oneof vendor into two optional fields
// (decision 6): exactly one of email_vendor / sms_vendor is non-zero.
message SendResponse {
  int64 id = 1;
  messaging.v1.MessageStatus status = 2;
  messaging.v1.EmailVendor email_vendor = 3;
  messaging.v1.SmsVendor sms_vendor = 4;
}

