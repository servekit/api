// RegionCode mirrors messaging.v1.RegionCode (see user.v1-style mirroring:
// testkit owns its wire types; the mapping layer is a plain field copy).
message RegionCode {
  string code = 1;
  string dial_code = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^\\+[1-9][0-9]{0,3}$"
  ];
  string name_zh = 3;
  string name_en = 4;
}

// ==================== GID debug (P5) ====================
//
// Mirrors gid-service/api/proto/gid/v1/gid.proto shape-for-shape. gid RPCs
// carry no caller-identity (global unique ID generation is caller-agnostic), so
// the testkit-owned messages are identical to gid.proto and the mapping layer
// (internal/service/gid) is a plain field copy. Only the type ownership moves
// to testkit.v1 (design spec v2 §3.1 — testkit.proto imports no downstream
// proto). protovalidate enforces count ∈ [1,1000] and id >= 1; downstream
// failures pass through as xerr (§9).

message NextIDRequest {}

message NextIDResponse {
  int64 id = 1;
}

message BatchNextIDRequest {
  int32 count = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 1000
  }];
}

message BatchNextIDResponse {
  repeated int64 ids = 1;
}

message DecomposeRequest {
  int64 id = 1 [(buf.validate.field).int64 = {gte: 1}];
}

message DecomposeResponse {
  int64 time = 1;
  int64 sequence = 2;
  int64 machine_id = 3;
  string generated_at = 4; // ISO8601 timestamp
}

// ==================== Dashboard (P5, aggregated) ====================
//
// GetDashboard fans out to message.GetEmailStats + message.GetSMSStats +
// storage.GetMyQuota + user.ListUsersPaged concurrently (fail-fast via errgroup)
// and assembles this response (design spec §10 "聚合型" reference example).
//
// The caller's Owner (for GetMyQuota) is injected from ctx by the BFF — it is
// NEVER present in GetDashboardRequest (v2 §3.2 rule 1: the BFF is the sole
// trust boundary). messaging.v1.EmailVendor / messaging.v1.SmsVendor / EmailVendorStats / SmsVendorStats
// are reused as-is from P4 above (mirrored from message.proto name-for-name and
// number-for-number), so the mapping layer is a plain int cast — no redefinition
// here. The sub-structures (EmailStats / SMSStats / MyQuota / UsersSummary)
// mirror the downstream response shapes as read-only snapshots.

message GetDashboardRequest {} // caller user_id injected from ctx for GetMyQuota

message DashboardResponse {
  EmailStats email_stats = 1;
  SMSStats sms_stats = 2;
  MyQuota quota = 3;
  UsersSummary users = 4;
}

